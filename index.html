<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Te espero en mi picnic! 🧺🌸</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #f48fb1 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* Decoraciones florales fijas */
    .corner-floral {
      position: fixed;
      font-size: 2.5rem;
      pointer-events: none;
      z-index: 2;
    }
    .top-left { top: 15px; left: 20px; }
    .top-right { top: 15px; right: 20px; }
    .bottom-left { bottom: 15px; left: 20px; }
    .bottom-right { bottom: 15px; right: 20px; }

    /* Flores flotantes de fondo */
    .bg-flower {
      position: fixed;
      pointer-events: none;
      user-select: none;
      animation: float 7s ease-in-out infinite;
      opacity: 0.7;
      z-index: 1;
    }

    .f1 { top: 12%; left: 15%; font-size: 2.2rem; animation-delay: 0s; }
    .f2 { top: 65%; left: 8%; font-size: 2.8rem; animation-delay: 2s; }
    .f3 { top: 20%; right: 12%; font-size: 2.5rem; animation-delay: 1s; }
    .f4 { top: 70%; right: 10%; font-size: 3rem; animation-delay: 3s; }
    .f5 { top: 45%; left: 4%; font-size: 2rem; animation-delay: 4s; }
    .f6 { top: 50%; right: 5%; font-size: 2.4rem; animation-delay: 2.5s; }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-18px) rotate(12deg); }
    }

    /* Pétalos cayendo */
    .petal {
      position: fixed;
      top: -10%;
      font-size: 1.5rem;
      pointer-events: none;
      z-index: 1;
      animation: fall 10s linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }

    .container {
      text-align: center;
      z-index: 5;
      padding: 15px;
      max-width: 1000px;
      width: 100%;
    }

    .header-title {
      color: #880e4f;
      font-size: clamp(1.7rem, 5vw, 2.4rem);
      font-weight: 800;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.9);
      letter-spacing: -0.5px;
    }

    /* Píldora de instrucciones mejorada */
    .instructions {
      margin-bottom: 25px;
      color: #880e4f;
      font-weight: 700;
      font-size: clamp(0.95rem, 3.5vw, 1.1rem);
      background: rgba(255, 240, 245, 0.75);
      backdrop-filter: blur(4px);
      border: 1.5 solid #f8bbd0;
      padding: 10px 22px;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(136, 14, 79, 0.08);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .instructions:hover {
      transform: scale(1.02);
      background: rgba(255, 240, 245, 0.9);
    }

    .instructions-icon {
      font-size: 1.25rem;
      display: inline-block;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    /* Layout principal con GIFs a los lados */
    .invitation-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      width: 100%;
    }

    .character-gif {
      width: 110px;
      height: auto;
      max-height: 130px;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
      user-select: none;
      pointer-events: none;
    }

    .usagi-flipped {
      transform: scaleX(-1);
    }

    /* Sobre interactivo responsive */
    .envelope-container {
      position: relative;
      width: min(320px, 85vw);
      height: min(220px, 58vw);
      background-color: #f06292;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(136, 14, 79, 0.25);
      cursor: pointer;
      perspective: 1000px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: calc(min(320px, 85vw) / 2) solid transparent;
      border-right: calc(min(320px, 85vw) / 2) solid transparent;
      border-top: calc(min(220px, 58vw) * 0.58) solid #ec407a;
      transform-origin: top;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 3;
    }

    .seal {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 44px;
      background: #c2185b;
      color: #fff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.3rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      z-index: 4;
      transition: opacity 0.3s ease;
    }

    .pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: calc(min(320px, 85vw) / 2) solid #f8bbd0;
      border-right: calc(min(320px, 85vw) / 2) solid #f8bbd0;
      border-bottom: calc(min(220px, 58vw) * 0.52) solid #f48fb1;
      border-radius: 0 0 12px 12px;
      z-index: 2;
    }

    .card-preview {
      position: absolute;
      bottom: 0px;
      left: 7.5%;
      width: 85%;
      height: 55%;
      background: #fff;
      border-radius: 8px 8px 0 0;
      z-index: 1;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.6s ease;
    }

    .card-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }

    .envelope-container.open .flap {
      transform: rotateX(180deg);
      z-index: 0;
    }

    .envelope-container.open .seal {
      opacity: 0;
    }

    .envelope-container.open .card-preview {
      transform: translateY(-70px);
    }

    /* Modal responsive */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(136, 14, 79, 0.6);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      padding: 15px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      position: relative;
      max-width: 440px;
      width: 100%;
      background: linear-gradient(145deg, #fff5f8, #fce4ec);
      border: 3px solid #f8bbd0;
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 20px 40px rgba(136, 14, 79, 0.35);
      transform: scale(0.8) translateY(30px);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active .modal-content {
      transform: scale(1) translateY(0);
    }

    .modal-content img {
      width: 100%;
      height: auto;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 12px;
      display: block;
    }

    .close-btn {
      position: absolute;
      top: -14px;
      right: -14px;
      width: 38px;
      height: 38px;
      background-color: #ec407a;
      color: white;
      border: 2px solid #ffffff;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s ease, background-color 0.2s ease;
      z-index: 10;
    }

    .close-btn:hover {
      background-color: #c2185b;
      transform: scale(1.15) rotate(90deg);
    }

    @media (max-width: 650px) {
      .invitation-wrapper {
        flex-direction: column;
        gap: 15px;
      }

      .character-gif {
        width: 85px;
        max-height: 100px;
      }

      .corner-floral {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- Flores en las esquinas -->
  <div class="corner-floral top-left">🌸🌷</div>
  <div class="corner-floral top-right">🌺🌸</div>
  <div class="corner-floral bottom-left">🧺🌸</div>
  <div class="corner-floral bottom-right">🌷🌺</div>

  <!-- Flores flotantes -->
  <div class="bg-flower f1">🌸</div>
  <div class="bg-flower f2">🌺</div>
  <div class="bg-flower f3">🌷</div>
  <div class="bg-flower f4">🧺</div>
  <div class="bg-flower f5">🌸</div>
  <div class="bg-flower f6">✨</div>

  <!-- Pétalos cayendo -->
  <div class="petal" style="left: 10%; animation-delay: 0s;">🌸</div>
  <div class="petal" style="left: 30%; animation-delay: 3s;">✨</div>
  <div class="petal" style="left: 55%; animation-delay: 1s;">🌸</div>
  <div class="petal" style="left: 75%; animation-delay: 5s;">🌷</div>
  <div class="petal" style="left: 90%; animation-delay: 2s;">🌸</div>

  <div class="container">
    <h1 class="header-title">¡Te espero en mi picnic! 🧺✨</h1>
    
    <div class="instructions" id="hint">
      <span class="instructions-icon">💌</span>
      <span>Toca el sobre para abrir tu invitación</span>
    </div>
    
    <div class="invitation-wrapper">
      <img src="usagi.gif" alt="Usagi" class="character-gif usagi-flipped">

      <div class="envelope-container" id="envelope">
        <div class="flap"></div>
        <div class="seal">🌸</div>
        <div class="card-preview">
          <img class="invitation-img" src="Invitacion-jian.png" alt="Invitación">
        </div>
        <div class="pocket"></div>
      </div>

      <img src="momonga-chiikawa.gif" alt="Momonga" class="character-gif">
    </div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <button class="close-btn" id="close-modal" aria-label="Cerrar">✖</button>
      <img class="invitation-img" src="Invitacion-jian.png" alt="Invitación Completa">
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const imgParam = urlParams.get('invitacion');
    const invitationImgs = document.querySelectorAll('.invitation-img');

    if (imgParam) {
      invitationImgs.forEach(img => {
        img.src = imgParam;
      });
    }

    const envelope = document.getElementById('envelope');
    const modal = document.getElementById('modal');
    const closeModal = document.getElementById('close-modal');

    envelope.addEventListener('click', () => {
      envelope.classList.add('open');
      setTimeout(() => {
        modal.classList.add('active');
      }, 500);
    });

    closeModal.addEventListener('click', () => {
      modal.classList.remove('active');
      envelope.classList.remove('open');
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('active');
        envelope.classList.remove('open');
      }
    });
  </script>

</body>
</html>
